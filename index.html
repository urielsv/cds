<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shelf bleed into the safe areas on notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="A personal compact disc collection you can flip through." />
    <title>MyCDs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Demo cover art is served from the Cover Art Archive, which redirects to
         archive.org; warm both early. `crossorigin` because covers are fetched
         with CORS (src/features/shelf/coverLoader.ts), which uses the anonymous
         connection pool. -->
    <link rel="preconnect" href="https://coverartarchive.org" crossorigin />
    <link rel="preconnect" href="https://archive.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
